<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee - Place Order</title>
  </head>
  <body>
    <header class="header">
      <h1 class="logo">Coffee.</h1>
      <nav class="navbar">
        <a href="index.html" class="logo"></a>

        <button class="hamburger" id="hamburger-btn">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-links" id="nav-links-container">
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="order.html">Order</a>
          <a href="review.html">Rate Us</a>
          <a href="admin.html">Dashboard</a>
        </div>
      </nav>
    </header>

    <main class="page-container">
      <div class="form-container">
        <h2>Customize Your Order</h2>
        <form action="#">
          <div class="form-group">
            <label for="coffee-type">Select Coffee</label>
            <select id="coffee-type">
              <option value="espresso" data-price="3.50">
                Espresso - $3.50
              </option>
              <option value="latte" data-price="4.50">
                Cafe Latte - $4.50
              </option>
              <option value="cappuccino" data-price="4.50">
                Cappuccino - $4.50
              </option>
              <option value="macchiato" data-price="5.00">
                Caramel Macchiato - $5.00
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="size">Size</label>
            <select id="size">
              <option value="small" data-extra="0.00">Small (Regular)</option>
              <option value="medium" data-extra="0.50">Medium (+ $0.50)</option>
              <option value="large" data-extra="1.00">Large (+ $1.00)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="notes">Special Instructions</label>
            <textarea
              id="notes"
              rows="3"
              placeholder="Extra sugar, oat milk, iced, etc..."
            ></textarea>
          </div>
          <div class="form-group">
            <label
              for="user-email"
              style="
                color: #e6b89c;
                font-weight: bold;
                display: block;
                margin-bottom: 8px;
              "
              >Your Email Address</label
            >

            <input
              type="email"
              id="user-email"
              required
              style="
                width: 100%;
                padding: 10px;
                background: #2b2521;
                border: 1px solid #4a3f35;
                border-radius: 4px;
                color: #fff;
                box-sizing: border-box;
              "
              placeholder="name@example.com"
            />
          </div>
          <button type="button" class="submit-btn" id="order-click-btn">
            Complete Order
          </button>
        </form>
      </div>
    </main>

    <script src="script.js?v=3"></script>
  </body>
</html>
