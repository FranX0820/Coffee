<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee - Place Order</title>
</head>
<body>
    <header class="header">
        <h1 class="logo">Coffee.</h1>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Order</a>
            <a href="review.html">Rate Us</a>
        </nav>
    </header>

    <main class="page-container">
        <div class="form-container">
            <h2>Customize Your Order</h2>
            <form action="#">
                <div class="form-group">
                    <label for="coffee-type">Select Coffee</label>
                    <select id="coffee-type">
                        <option value="espresso">Espresso - $3.50</option>
                        <option value="latte">Cafe Latte - $4.50</option>
                        <option value="cappuccino">Cappuccino - $4.50</option>
                        <option value="macchiato">Caramel Macchiato - $5.00</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="size">Size</label>
                    <select id="size">
                        <option value="small">Small (Regular)</option>
                        <option value="medium">Medium (+ $0.50)</option>
                        <option value="large">Large (+ $1.00)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Special Instructions</label>
                    <textarea id="notes" rows="3" placeholder="Extra sugar, oat milk, iced, etc..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Complete Order</button>
            </form>
        </div>
    </main>
</body>
</html>
